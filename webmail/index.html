<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webmail — ACoProTur</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://ferozo.email/">
<style>
  :root{
    --azul:#1d2270;
    --azul-dark:#161d5e;
    --dorado:#f2b705;
    --blanco:#ffffff;
    --fondo:#f6f5f1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--fondo);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--azul-dark);
    text-align:center;
  }
  .caja{
    background:var(--blanco);
    border:1px solid #eceaf6;
    border-radius:18px;
    padding:40px 32px;
    max-width:420px;
    width:100%;
    box-shadow:0 12px 30px rgba(22,29,94,0.08);
  }
  h1{
    font-size:1.35rem;
    margin:0 0 10px;
    color:var(--azul);
  }
  p{
    font-size:0.95rem;
    color:#5a5f8a;
    line-height:1.6;
    margin:0 0 22px;
  }
  .spinner{
    width:34px;height:34px;
    margin:0 auto 22px;
    border:3px solid #e4e2f2;
    border-top-color:var(--dorado);
    border-radius:50%;
    animation:giro 0.9s linear infinite;
  }
  @keyframes giro{to{transform:rotate(360deg);}}
  a.btn{
    display:inline-block;
    background:var(--azul);
    color:var(--blanco);
    text-decoration:none;
    font-weight:700;
    font-size:0.92rem;
    padding:12px 26px;
    border-radius:999px;
  }
  a.btn:hover{background:var(--azul-dark);}
  .pie{
    margin-top:20px;
    font-size:0.78rem;
    color:#8388ad;
  }
</style>
</head>
<body>
  <div class="caja">
    <div class="spinner"></div>
    <h1>Llevándote al webmail</h1>
    <p>Te estamos redirigiendo al correo de ACoProTur. Si no ocurre en unos segundos, usá el botón.</p>
    <a class="btn" href="https://ferozo.email/">Ir al webmail</a>
    <div class="pie">ACoProTur · Asociación Cordobesa de Profesionales de Turismo</div>
  </div>
  <script>
    window.location.replace("https://ferozo.email/");
  </script>
</body>
</html>
